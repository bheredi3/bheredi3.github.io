<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="landscaping.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact our landscaping company. Serving all of Arizona. Free estimates, affordable pricing, and reliable service. Regular maintenance, irrigation work, and property design services.">
    <title>Mely's Landscaping LLC</title>
</head>

<body>

    <header>
        <img src="Melys_Green_Logo_Transparent.png"
             alt="Mely's Landscaping AZ Logo"
             class="company-logo">
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="maintenance.html">Property Maintenance</a>
        <a href="irrigation.html">Irrigation and Property Design</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <main class="contact-main">

        <div class="contact-heading">
            <h2>Contact Us!</h2>
        </div>

        <div class="contact-form">

            <h3>Get a Free Estimate!</h3>

            <form action="#">

                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="service">Service Interested In:</label>
                <select id="service" name="service" required>
                    <option value="">Select a Service</option>
                    <option value="maintenance">Property Maintenance</option>
                    <option value="irrigation">Irrigation</option>
                    <option value="design">Property Design</option>
                    <option value="other">Other</option>
                </select>

                <input type="submit" value="Submit">

            </form>

        </div>

    </main>

    <footer>
        <div>
            <h3>Contact Us!</h3>

            <p>Phone Number: (480) 543-9223</p>

            <p>
                Email:
                <a href="mailto:Brittanyhr18@gmail.com">
                    Brittanyhr18@gmail.com
                </a>
            </p>

            <p>&copy; 2026 Mely's Landscaping</p>
        </div>
    </footer>

</body>

</html>
