<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="Landscaping.css">
    <meta charset="UTF-8">
    <title>Mely's Landscaping LLC</title>
</head>

<body>

    <header>
        <h1>Mely's Landscaping</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="maintenance.html">Property Maintenance</a>
        <a href="irrigation.html">Irrigation and Property Design</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <div class="contact-heading">
        <h2>Contact Us!</h2>
    </div>

    <div class="contact-form">

        <h3>Get a Free Estimate!</h3>

        <form>

            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="service">Service Interested In:</label>
            <select id="service" name="service" required>
                <option value="">Select a Service</option>
                <option value="maintenance">Property Maintenance</option>
                <option value="irrigation">Irrigation</option>
                <option value="design">Property Design</option>
                <option value="other">Other</option>
            </select>

            <input type="submit" value="Submit">

        </form>

    </div>

</body>

</html>
